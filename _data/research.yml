    abstract: "What is the effect of the use of physical vs digital methods of payment on a consumer’s propensity to spend? Methodology: Time series data analysis on household consumption data pre- and post-demonetization. Online behavioral survey experiment (n = 200). Pilot field survey experiment (n = 32)."
