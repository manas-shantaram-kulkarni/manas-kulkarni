  - title: "The Social Connectedness Index: A Large-Scale Dataset of Social Ties Across Geographic Locations"
    coauthors: "Drew Johnston, Theresa Kuchler, Manas Kulkarni, and Johannes Stroebel"
    publication_info: "Data in Brief, 67(112905), June 2026"
    abstract: "This article describes a new release of the Social Connectedness Index (SCI), a large-scale measure of social ties across geographic locations constructed from Facebook friendship links. The newly available SCI data have substantially expanded global coverage and finer geographic resolution than prior versions, and provide measures of social connectedness for national and subnational units across 178 countries. The SCI dataset is based on Facebook friendship networks from January 2026 and is freely available through the Humanitarian Data Exchange. This data descriptor details the methodology used to construct the measure, the structure of the SCI dataset, and its geographic coverage at various granularities."
    presented: ""
    links:
      - label: "Data Download"
        url: "https://data.humdata.org/dataset/social-connectedness-index"
      - label: "Data Visualization"
        url: "https://social-connectedness.org/"

working:
  - title: "Caste, Class, & Cutoffs: The effect of identity-based and income-based affirmative action on educational attainment in India"
    coauthors: ""
    publication_info: "Honors thesis in Economics, advised by Alejandro Ganimian. Harvard, Spring 2025."
    abstract: "India's extensive affirmative action program mandates quotas based on caste-identity and income-level for public sector jobs and admission into colleges. This paper examines the effect of two policies on educational outcomes in India -- an expansion in caste-based reservations through a shift in the income threshold in 2017 (Creamy Layer) and the introduction of purely income-based reservations in 2019 (Economically Weaker Section). I use a large nationally representative panel dataset (2014–2024) of 1.3 million individuals to employ a cohort difference-in-differences strategy. I find that the expansion in caste-based reservations increased schooling by 0.26 to 0.88 years for students who were previously ineligible for reservations but became eligible due to the policy change and were young enough to benefit. This effect is an increasing function of the number of years of exposure to the policy; students who are younger at the time of policy change experience greater increases in schooling. I also find evidence that suggests that the introduction of the income-based quotas is associated with an increase in the educational attainment of affected individuals. These findings contribute to the literature on the effect of affirmative action policies on human capital investment, particularly policies designed along socioeconomic criteria."
    presented: "Presented at Pforzheimer House Thesis Presentations, Harvard University, Spring 2025."
    links: []

  - title: "Stay Hungry, Stay Foolish: The effect of mid-day school meals on academic performance in India"
    coauthors: ""
    publication_info: "Development Economics with Sanjay Jain. Oxford, Spring 2024."
    abstract: "What is the effect of increased nutrition in the form of an additional daily meal on the academic performance of school-age children as measured by standardized tests? Methodology: Instrumental variables regression model using a policy variation (extra meals provided in drought affected regions) on an existing large-N dataset."
    presented: ""
